<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="site-shell">

  <div data-masthead></div>

  <main class="tab-well">
    <div class="page-pad">
      <h1>Invoice archive</h1>
      <p class="subtext">Every invoice you've saved on this device, in one ledger.</p>

      <div class="archive-toolbar">
        <input type="search" id="search" placeholder="Search by client or invoice number…" />
        <select id="status-filter" style="max-width:180px;">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="sent">Awaiting payment</option>
          <option value="overdue">Overdue</option>
          <option value="paid">Paid</option>
        </select>
      </div>

      <div id="table-mount"></div>
    </div>
  </main>

  <footer class="site-footer">LEDGER · A STATIC INVOICE BOOK · YOUR DATA STAYS IN THIS BROWSER</footer>
</div>

<script src="app.js"></script>
<script src="history.js"></script>
</body>
</html>
